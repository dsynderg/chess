# SLF4J Simple Logger Configuration
# Default log level for all loggers
org.slf4j.simpleLogger.defaultLogLevel=info

# Log level for specific packages
# Set to debug to see SQL queries and detailed operations
org.slf4j.simpleLogger.log.dataaccess=info

# Show date and time in logs
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss

# Show thread name
org.slf4j.simpleLogger.showThreadName=false

# Show logger name
org.slf4j.simpleLogger.showLogName=true

# Show short logger name (just the class name, not the full package)
org.slf4j.simpleLogger.showShortLogName=true

# Level start (show level at start of log line)
org.slf4j.simpleLogger.levelInBrackets=true

# Log output (default is System.err)
# Uncomment to log to a file instead:
# org.slf4j.simpleLogger.logFile=logs/sql.log

# To enable DEBUG logging for SQL operations, change the following to debug:
# org.slf4j.simpleLogger.log.dataaccess.SQLAuthDatabase=debug
# org.slf4j.simpleLogger.log.dataaccess.SQLUserDatabase=debug
# org.slf4j.simpleLogger.log.dataaccess.SQLGameDatabase=debug
# org.slf4j.simpleLogger.log.dataaccess.DatabaseManager=debug
